<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SnapDOM diagnostics v1.0.0</title>
<style>body{font:16px system-ui;margin:16px auto;padding:0 12px;max-width:780px;color:#172033;background:#fff}h2{font-size:20px;margin:8px 0}button{font:inherit;min-height:44px;border:1px solid #aab5c4;border-radius:8px;background:white;padding:8px 12px;margin:3px}button.primary{background:#172033;color:white}button:disabled{opacity:.45}#fixture{width:280px;height:140px;position:relative;background:rgb(255,0,0);color:white;box-sizing:border-box;overflow:hidden}#green{position:absolute;left:140px;top:0;width:140px;height:140px;background:rgb(0,180,0)}#fixture b{position:absolute;top:12px;left:12px}#modern{position:absolute;left:12px;bottom:10px;background:color(display-p3 .2 .4 .8);color:oklab(.95 0 0);padding:4px}#preview img{max-width:100%;border:1px solid #aaa;margin:4px}#preview canvas{max-width:100%;border:1px solid #aaa}textarea{box-sizing:border-box;width:100%;height:220px;font:12px monospace}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px monospace}#log{max-height:250px;overflow:auto}small{color:#475569}#status{min-height:24px}</style></head>
<body><h2>SnapDOM diagnostic lab · v1.0.0</h2><small>Tests pinned 3.8.3 in this browser context. No image or report uploads. Run once, then copy the report.</small>
<div><button class="primary" id="run">Run all probes</button><button id="copy">Copy report</button><button id="copyPNG" disabled>Copy test PNG</button></div><div id="status">Ready</div>
<div id="fixture"><div id="green"></div><b>RED / GREEN</b><span id="modern">Modern CSS</span><svg width="100" height="28" style="position:absolute;left:150px;top:45px"><text x="0" y="20" fill="white">Q(s,a)</text></svg></div>
<div id="preview"></div><pre id="log"></pre><textarea id="report" readonly aria-label="Full diagnostic report"></textarea>
<script>
"use strict";
const V="1.0.0", PKG="3.8.3", $=id=>document.getElementById(id);
const bases={jsdelivr:"https://cdn.jsdelivr.net/npm/@zumer/snapdom@"+PKG,unpkg:"https://unpkg.com/@zumer/snapdom@"+PKG};
const urls=Object.fromEntries(Object.entries(bases).map(([k,v])=>[k,{manifest:v+"/package.json",esm:v+"/dist/snapdom.mjs",classic:v+"/dist/snapdom.js"}]));
let R=null,start=0,busy=false,lastBlob=null,engines=[];
const err=e=>({name:e?.name||"",message:String(e?.message||e),stack:String(e?.stack||"").slice(0,5000),cause:e?.cause?String(e.cause):null});
function safeURL(s){try{const u=new URL(s,location.href);return u.origin+u.pathname;}catch{return String(s||"").slice(0,300)}}
function journal(stage,data={}){if(!R)return;R.events.push({ms:Math.round(performance.now()-start),stage,...data});update();}
function update(){if(!R)return;$("report").value=JSON.stringify(R,null,2);$("log").textContent=R.events.slice(-24).map(e=>e.ms+"ms "+e.stage+(e.label?" · "+e.label:"")+(e.outcome?" · "+e.outcome:"")).join("\n");$("status").textContent=R.events.at(-1)?.stage||"Ready";}
function resources(){return performance.getEntriesByType("resource").filter(r=>/snapdom|jsdelivr|unpkg/.test(r.name)).map(r=>({url:safeURL(r.name),type:r.initiatorType,start:r.startTime,duration:r.duration,fetchStart:r.fetchStart,redirectStart:r.redirectStart,redirectEnd:r.redirectEnd,domainLookupStart:r.domainLookupStart,domainLookupEnd:r.domainLookupEnd,connectStart:r.connectStart,connectEnd:r.connectEnd,secureConnectionStart:r.secureConnectionStart,requestStart:r.requestStart,responseStart:r.responseStart,responseEnd:r.responseEnd,transferSize:r.transferSize,encodedBodySize:r.encodedBodySize,decodedBodySize:r.decodedBodySize,nextHopProtocol:r.nextHopProtocol,responseStatus:r.responseStatus??null,deliveryType:r.deliveryType??null,serverTiming:r.serverTiming?.map(t=>({name:t.name,duration:t.duration,description:t.description}))||[]}));}
function env(){const vv=window.visualViewport;let framed=false;try{framed=top!==self}catch{framed=true}return {ua:navigator.userAgent,platform:navigator.platform,vendor:navigator.vendor,language:navigator.language,secureContext:isSecureContext,origin:location.origin,page:safeURL(location.href),framed,referrer:safeURL(document.referrer||""),readyState:document.readyState,visibility:document.visibilityState,online:navigator.onLine,viewport:[innerWidth,innerHeight],screen:[screen.width,screen.height],devicePixelRatio,scroll:[scrollX,scrollY],visualViewport:vv?{width:vv.width,height:vv.height,scale:vv.scale,offsetLeft:vv.offsetLeft,offsetTop:vv.offsetTop}:null,features:{fetch:typeof fetch,URL:typeof URL,blob:typeof Blob,cryptoDigest:!!globalThis.crypto?.subtle,clipboardRead:!!navigator.clipboard?.read,clipboardWrite:!!navigator.clipboard?.write,ClipboardItem:typeof ClipboardItem,canvas:!!document.createElement("canvas").getContext("2d"),foreignObject:typeof SVGForeignObjectElement,documentFonts:!!document.fonts,oklab:CSS.supports("color","oklab(.5 0 0)"),displayP3:CSS.supports("color","color(display-p3 1 0 0)")},cspMeta:[...document.querySelectorAll('meta[http-equiv="Content-Security-Policy" i]')].map(x=>x.content)};}
window.addEventListener("error",e=>{if(!R)return;const target=e.target;journal("window error",{message:e.message||null,file:safeURL(e.filename||target?.src||target?.href||""),line:e.lineno||null,column:e.colno||null,error:e.error?err(e.error):null,target:target?.tagName||null});},true);
window.addEventListener("unhandledrejection",e=>journal("unhandled rejection",{error:err(e.reason)}));
document.addEventListener("securitypolicyviolation",e=>journal("CSP violation",{blockedURI:safeURL(e.blockedURI),effectiveDirective:e.effectiveDirective,violatedDirective:e.violatedDirective,originalPolicy:e.originalPolicy,disposition:e.disposition,statusCode:e.statusCode,sourceFile:safeURL(e.sourceFile),line:e.lineNumber,column:e.columnNumber,sample:e.sample}));
document.addEventListener("visibilitychange",()=>journal("visibility",{state:document.visibilityState}));
window.addEventListener("online",()=>journal("online"));window.addEventListener("offline",()=>journal("offline"));
function timeout(p,ms){let id;return Promise.race([p,new Promise((_,reject)=>id=setTimeout(()=>reject(Error("Deadline "+ms+"ms; underlying work may continue")),ms))]).finally(()=>clearTimeout(id));}
async function probe(label,fn,ms=15000){journal("probe start",{label});const t=performance.now();try{const result=await timeout(Promise.resolve().then(fn),ms);R.results.push({label,outcome:"pass",ms:Math.round(performance.now()-t),result});journal("probe end",{label,outcome:"pass"});return result;}catch(e){R.results.push({label,outcome:"fail",ms:Math.round(performance.now()-t),error:err(e)});journal("probe end",{label,outcome:"fail",error:err(e)});return null;}}
async function fetchInfo(url,manifest=false){
 const ac=new AbortController(),timer=setTimeout(()=>ac.abort(),11000);try{const r=await fetch(url,{mode:"cors",credentials:"omit",cache:"no-store",signal:ac.signal});const bytes=await r.arrayBuffer(),body=new TextDecoder().decode(bytes);let hash=null;try{if(globalThis.crypto?.subtle)hash=Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",bytes)),x=>x.toString(16).padStart(2,"0")).join("")}catch{}
 const result={url,finalURL:r.url,status:r.status,statusText:r.statusText,ok:r.ok,type:r.type,redirected:r.redirected,headers:Object.fromEntries(r.headers.entries()),byteLength:bytes.byteLength,sha256:hash,bodyPrefix:body.slice(0,180),bodySuffix:body.slice(-180)};
 if(manifest)try{const j=JSON.parse(body);result.package={name:j.name,version:j.version,main:j.main,module:j.module,type:j.type,exports:j.exports,dependencies:j.dependencies||{}};}catch(e){result.parseError=err(e);}
 journal("HTTP response",result);if(!r.ok)throw Error("HTTP "+r.status);return result;
 }finally{clearTimeout(timer)}
}
function shape(lib){return {type:typeof lib,keys:Object.keys(lib||{}),toCanvas:typeof lib?.toCanvas,toPng:typeof lib?.toPng,toRaw:typeof lib?.toRaw};}
async function loadModule(label,url){const m=await import(url);const lib=m.snapdom;if(typeof lib?.toCanvas!=="function")throw Error("Unexpected module exports: "+Object.keys(m));engines.push({label,lib});return {exports:Object.keys(m),api:shape(lib)}}
async function loadClassic(label,url){
 const old=window.snapdom;const s=document.createElement("script");s.src=url;s.crossOrigin="anonymous";
 try{await new Promise((resolve,reject)=>{let t=setTimeout(()=>reject(Error("Script load deadline")),12000);s.onload=()=>{clearTimeout(t);resolve()};s.onerror=()=>{clearTimeout(t);reject(Error("Classic script error event"))};document.head.append(s)});
 const lib=window.snapdom;const info={global:shape(lib),changed:lib!==old};if(typeof lib?.toCanvas!=="function"||lib===old)throw Error("Script loaded without a new SnapDOM API");engines.push({label,lib});return info;
 }finally{s.remove()}
}
function inspectCanvas(c){const ctx=c.getContext("2d");const W=c.width,H=c.height;const pixel=(x,y)=>Array.from(ctx.getImageData(Math.floor(W*x),Math.floor(H*y),1,1).data);const left=pixel(.25,.75),right=pixel(.75,.75);return {width:W,height:H,left,right,redGreen:left[0]>180&&left[1]<80&&left[3]>200&&right[1]>100&&right[0]<80&&right[3]>200};}
async function inspectPNG(c,label){const data=c.toDataURL("image/png");const img=new Image();img.src=data;await img.decode();const blob=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(Error("Empty PNG blob")),"image/png"));const blobURL=URL.createObjectURL(blob);try{const im=new Image();im.src=blobURL;await im.decode();$("preview").append(img);return {dataURLLength:data.length,prefix:data.slice(0,32),dataDimensions:[img.naturalWidth,img.naturalHeight],blobBytes:blob.size,blobType:blob.type,blobDimensions:[im.naturalWidth,im.naturalHeight],blob};}finally{URL.revokeObjectURL(blobURL)}}
async function renderTest(engine){const lib=engine.lib,fixture=$("fixture");const options={dpr:1,scale:1,cache:"disabled",embedFonts:false};await probe("SVG serialization · "+engine.label,async()=>{const result=await lib(fixture,options);return {urlLength:result.url?.length||0,prefix:result.url?.slice(0,80),methods:Object.keys(result)}},20000);
 await probe("Element render · "+engine.label,async()=>{const c=await lib.toCanvas(fixture,options);const info=inspectCanvas(c);journal("canvas pixels",{label:engine.label,...info});if(!info.redGreen||Math.abs(info.width-280)>2||Math.abs(info.height-140)>2)throw Error("Wrong dimensions or red/green pixels");const p=await inspectPNG(c,engine.label);lastBlob=p.blob;$("copyPNG").disabled=false;delete p.blob;return {pixels:info,png:p};},25000);
 await probe("Actual root clip · "+engine.label,async()=>{const r=fixture.getBoundingClientRect();const clip={x:r.left+scrollX,y:r.top+scrollY,width:r.width,height:r.height};journal("clip coordinates",{clip});const c=await lib.toCanvas(document.documentElement,{...options,clip,exclude:["#preview","#report","#log"]});const info=inspectCanvas(c);journal("clip pixels",info);if(!info.redGreen||Math.abs(info.width-280)>2||Math.abs(info.height-140)>2)throw Error("Wrong clipped pixels or dimensions");const p=await inspectPNG(c,engine.label+" clip");lastBlob=p.blob;$("copyPNG").disabled=false;delete p.blob;return {pixels:info,png:p};},25000);
}
$("run").onclick=async()=>{if(busy)return;busy=true;$("run").disabled=true;$("preview").replaceChildren();$("copyPNG").disabled=true;lastBlob=null;engines=[];start=performance.now();R={schema:"ai_pill_os.snapdom_lab",version:V,packageVersion:PKG,time:new Date().toISOString(),environment:env(),urls,events:[],results:[],resourceTiming:[]};journal("start");
 try{
 await Promise.all(Object.entries(urls).flatMap(([cdn,u])=>Object.entries(u).map(([kind,url])=>probe("fetch "+cdn+" "+kind,()=>fetchInfo(url,kind==="manifest")))));
 await probe("control: data module",async()=>{const m=await import("data:text/javascript,export%20const%20marker%3D42");if(m.marker!==42)throw Error("Wrong export");return {marker:m.marker}});
 await Promise.all(Object.entries(urls).map(([cdn,u])=>probe("ESM "+cdn,()=>loadModule("ESM "+cdn,u.esm))));
 for(const [cdn,u] of Object.entries(urls))await probe("classic "+cdn,()=>loadClassic("classic "+cdn,u.classic));
 await probe("canvas/PNG control",async()=>{const c=document.createElement("canvas");c.width=280;c.height=140;const ctx=c.getContext("2d");ctx.fillStyle="red";ctx.fillRect(0,0,140,140);ctx.fillStyle="green";ctx.fillRect(140,0,140,140);const info=inspectCanvas(c);const p=await inspectPNG(c,"control");if(!info.redGreen)throw Error("Canvas control failed");delete p.blob;return {pixels:info,png:p}});
 if(engines.length){await renderTest(engines[0]);}else journal("render skipped",{reason:"No verified engine loaded"});
 }catch(e){journal("runner error",{error:err(e)})}finally{R.resourceTiming=resources();R.finished=new Date().toISOString();journal("complete",{engines:engines.map(x=>x.label)});busy=false;$("run").disabled=false;}};
$("copy").onclick=async()=>{if(!R)return;R.resourceTiming=resources();update();try{await navigator.clipboard.writeText($("report").value);$("status").textContent="Report copied";}catch(e){$("report").focus();$("report").select();$("status").textContent="Use native Copy on selected report";}};
$("copyPNG").onclick=async()=>{if(!lastBlob||!R)return;try{await navigator.clipboard.write([new ClipboardItem({"image/png":lastBlob})]);journal("clipboard PNG",{outcome:"pass",bytes:lastBlob.size});}catch(e){journal("clipboard PNG",{outcome:"fail",error:err(e)});}};
</script></body></html>
